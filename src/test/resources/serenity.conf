webdriver {
  driver = firefox
  autodownload = false

  capabilities {
    browserName = "firefox"
    acceptInsecureCerts = true

    "moz:firefoxOptions" {
      args = [
        "-private",       # Modo Incógnito en Firefox
        "--maximized"     # Maximizar (aunque Firefox a veces prefiere manejar esto por código)
      ]
    }
  }
}

serenity {
  take.screenshots = AFTER_EACH_STEP
  console.colors = true
  logging = verbose
}
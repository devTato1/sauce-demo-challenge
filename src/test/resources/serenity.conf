webdriver {
  driver = firefox
  autodownload = false

  capabilities {
    browserName = "firefox"
    acceptInsecureCerts = true

    "moz:firefoxOptions" {
      args = [
        "-private",
        "--maximized"
      ]
    }
  }
}

serenity {
  take.screenshots = AFTER_EACH_STEP
  console.colors = true
  logging = verbose
}